services:
  - type: web
    name: vit-ap-hostel-demo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app init-db && gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///hostel_demo.db
